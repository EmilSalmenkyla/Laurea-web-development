<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <title>Työpaja 3</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>

<body class="ws3">
    <h1>Työpaja 3: JavaScript-tapahtumat</h1>
    <hr>

    
    <h2 id="h1-title">Harjoitus 1: Klikkaus</h2>

    <p>
        <button id="btnClick">Paina minua</button>
        <button id="btnTable">Näytä eläintaulukko</button>
    </p>

    <div id="tableContainer"></div>

    <hr>

    
    <h2 id="h2-title">Harjoitus 2: Kuuntelijat ja DOM</h2>

    <hr>

    
    <h2>Harjoitus 3: Syöttötapahtumat</h2>

    <form id="feedbackForm" novalidate>
        <label for="feedback">Palaute:</label><br>
        <textarea id="feedback" placeholder="Kirjoita palautteesi..." rows="5"></textarea><br>

        <div style="margin: 4px 0;">
            <span id="charcount">0/200</span>
            <span id="status" aria-live="polite" style="margin-left: 8px; color: #666;"></span>
        </div>

        <button id="sendBtn" type="submit">Lähetä</button>
    </form>

    <h3>Esikatselu</h3>
    <div id="preview" class="preview-box">
        
    </div>

    <hr>

 
    <h2>Harjoitus 4: Lomakkeen lähetys</h2>

    <hr>


    <h2>Harjoitus 5: Näppäimistötapahtumat</h2>

    <div id="keybox" class="keybox">
        Paina mitä tahansa näppäintä...
    </div>

    <p id="keyinfo"></p>

</body>
</html>
